<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — FPO Ledger</title>
  <meta name="description" content="FPO Ledger Admin Portal. Sign in with your admin credentials to access the FPO Ledger dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          160deg,
          rgba(5, 30, 16, 0.86) 0%,
          rgba(9, 40, 26, 0.80) 45%,
          rgba(15, 55, 32, 0.72) 100%
        ),
        url('hero.jpg') center center / cover no-repeat fixed;
      padding: 24px;
    }

    /* ── Login Card ────────────────────────────────────────────────────────── */
    .login-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.4),
        0 8px 24px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.15);
      animation: cardIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.93) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── Card Header ───────────────────────────────────────────────────────── */
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #09281a 0%, #16a34a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(22, 163, 74, 0.35);
    }

    .login-logo svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
    }

    .login-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: #09281a;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .login-heading {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #111827;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* ── Form ──────────────────────────────────────────────────────────────── */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      letter-spacing: 0.01em;
    }

    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: #9ca3af;
      pointer-events: none;
    }

    .field-input {
      width: 100%;
      padding: 13px 44px 13px 42px;
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      background: #f9fafb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14.5px;
      color: #111827;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .field-input::placeholder { color: #9ca3af; }

    .field-input:focus {
      border-color: #16a34a;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }

    .field-input.error {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }

    /* Password toggle */
    .toggle-vis-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s ease;
    }

    .toggle-vis-btn:hover { color: #374151; }

    .toggle-vis-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    /* Inline field error */
    .field-error-msg {
      font-size: 12.5px;
      color: #dc2626;
      display: none;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .field-error-msg.visible { display: flex; }

    .field-error-msg svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      flex-shrink: 0;
    }

    /* Auth error banner */
    .auth-error-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 12px;
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.5;
      animation: shakeX 0.4s ease;
    }

    .auth-error-banner.visible { display: flex; }

    .auth-error-banner svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      flex-shrink: 0;
      margin-top: 1px;
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    /* ── Submit button ─────────────────────────────────────────────────────── */
    .btn-signin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #09281a 0%, #16a34a 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15.5px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.35);
      letter-spacing: -0.1px;
      margin-top: 4px;
    }

    .btn-signin:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.42);
    }

    .btn-signin:active:not(:disabled) { transform: translateY(0); }

    .btn-signin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    .btn-signin.loading .btn-spinner { display: block; }
    .btn-signin.loading .btn-text { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Back link ─────────────────────────────────────────────────────────── */
    .back-link-row {
      text-align: center;
      margin-top: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: #6b7280;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .back-link:hover { color: #16a34a; }

    .back-link svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    /* ── No-signup note ────────────────────────────────────────────────────── */
    .no-signup-note {
      text-align: center;
      margin-top: 16px;
      font-size: 12.5px;
      color: #9ca3af;
    }

    /* ── Responsive ────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      .login-card {
        padding: 32px 20px;
        border-radius: 20px;
      }
      .login-heading {
        font-size: 21px;
      }
      .login-sub {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card" role="main">

    <!-- Header -->
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 20h10"/>
          <path d="M10 20c0-4 1-7 2-9"/>
          <path d="M12 11c1.5-2.5 4.5-3.5 7-3-1 3-3.5 5.5-7 5.5"/>
          <path d="M12 11c-1.5-2-4-2.5-6-2 .5 2.5 2.5 4.5 6 5"/>
        </svg>
      </div>
      <div class="login-brand">FPO Ledger</div>
      <h1 class="login-heading">Admin Portal Login</h1>
      <p class="login-sub">Enter your admin credentials to access the dashboard.</p>
    </div>

    <!-- Auth error banner -->
    <div class="auth-error-banner" id="authErrorBanner" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="authErrorText">Invalid email or password. Please try again.</span>
    </div>

    <!-- Form -->
    <form class="login-form" id="loginForm" novalidate>

      <!-- Email -->
      <div class="field-group">
        <label class="field-label" for="loginEmail">Email address</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            id="loginEmail"
            class="field-input"
            placeholder="admin@fpoledger.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            aria-required="true"
            aria-describedby="emailError"
          >
        </div>
        <div class="field-error-msg" id="emailError" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="emailErrorText">Please enter your email address.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label" for="loginPassword">Password</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="loginPassword"
            class="field-input"
            placeholder="••••••••"
            autocomplete="current-password"
            aria-required="true"
            aria-describedby="passwordError"
          >
          <button
            type="button"
            class="toggle-vis-btn"
            id="togglePasswordBtn"
            aria-label="Toggle password visibility"
            title="Show / hide password"
          >
            <!-- Eye icon (shown when password is hidden) -->
            <svg id="eyeOpenIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (shown when password is visible) -->
            <svg id="eyeClosedIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="field-error-msg" id="passwordError" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Please enter your password.</span>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-signin" id="signinBtn">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-text">Sign in</span>
      </button>

    </form>

    <!-- No sign-up note -->
    <p class="no-signup-note">Admin access only &mdash; no public sign-up</p>

    <!-- Back link -->
    <div class="back-link-row">
      <a href="landing.html" class="back-link" id="backToHomeLink">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to home
      </a>
    </div>
  </div>

  <script>
    // ── Redirect if already logged in ──────────────────────────────────────────
    AgriAuth.redirectIfLoggedIn('index.html');

    // ── DOM refs ────────────────────────────────────────────────────────────────
    const form           = document.getElementById('loginForm');
    const emailInput     = document.getElementById('loginEmail');
    const passwordInput  = document.getElementById('loginPassword');
    const emailError     = document.getElementById('emailError');
    const passwordError  = document.getElementById('passwordError');
    const authBanner     = document.getElementById('authErrorBanner');
    const authErrorText  = document.getElementById('authErrorText');
    const signinBtn      = document.getElementById('signinBtn');
    const togglePassBtn  = document.getElementById('togglePasswordBtn');
    const eyeOpenIcon    = document.getElementById('eyeOpenIcon');
    const eyeClosedIcon  = document.getElementById('eyeClosedIcon');

    // ── Password visibility toggle ──────────────────────────────────────────────
    togglePassBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      eyeOpenIcon.style.display   = isHidden ? 'none'  : 'block';
      eyeClosedIcon.style.display = isHidden ? 'block' : 'none';
      togglePassBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });

    // ── Clear errors on input ───────────────────────────────────────────────────
    emailInput.addEventListener('input', () => {
      emailInput.classList.remove('error');
      emailError.classList.remove('visible');
      authBanner.classList.remove('visible');
    });

    passwordInput.addEventListener('input', () => {
      passwordInput.classList.remove('error');
      passwordError.classList.remove('visible');
      authBanner.classList.remove('visible');
    });

    // ── Form submission ─────────────────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email    = emailInput.value.trim();
      const password = passwordInput.value;
      let valid = true;

      // Reset state
      emailInput.classList.remove('error');
      passwordInput.classList.remove('error');
      emailError.classList.remove('visible');
      passwordError.classList.remove('visible');
      authBanner.classList.remove('visible');

      // Validate email
      if (!email) {
        emailInput.classList.add('error');
        emailError.classList.add('visible');
        document.getElementById('emailErrorText').textContent = 'Please enter your email address.';
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.classList.add('error');
        emailError.classList.add('visible');
        document.getElementById('emailErrorText').textContent = 'Please enter a valid email address.';
        valid = false;
      }

      // Validate password
      if (!password) {
        passwordInput.classList.add('error');
        passwordError.classList.add('visible');
        valid = false;
      }

      if (!valid) return;

      // Loading state
      signinBtn.disabled = true;
      signinBtn.classList.add('loading');

      // Simulate a short network delay for realism
      await new Promise(r => setTimeout(r, 700));

      const result = AgriAuth.signIn(email, password);

      if (result.ok) {
        // Redirect to dashboard
        window.location.replace('index.html');
      } else {
        signinBtn.disabled = false;
        signinBtn.classList.remove('loading');
        authErrorText.textContent = result.error;
        authBanner.classList.add('visible');
        // Re-animate shake
        authBanner.style.animation = 'none';
        void authBanner.offsetWidth; // reflow
        authBanner.style.animation = '';
        emailInput.classList.add('error');
        passwordInput.classList.add('error');
      }
    });
  </script>
</body>
</html>
